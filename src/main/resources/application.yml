spring:
  application:
    name: notification-events-delivery
  threads:
    virtual:
      enabled: true
  cloud:
    aws:
      region:
        static: us-east-1
      sqs:
        listener:
          # Mensajes en vuelo por cola: el techo real de entregas concurrentes,
          # aplicado por el SemaphoreBackPressureHandler del contenedor. Con
          # listeners asíncronos sobre virtual threads los hilos de plataforma
          # solo encolan, así que subirlo no cuesta hilos del SO.
          max-concurrent-messages: ${SQS_MAX_CONCURRENT:100}
      # Sin credenciales fijadas aquí a propósito: Spring Cloud AWS cae a
      # `DefaultCredentialsProvider` (env vars, IRSA/EKS, credenciales de
      # contenedor en ECS, instance profile en EC2, ~/.aws/credentials...),
      # que prueba cada mecanismo según el entorno de despliegue real. Forzar
      # `credentials.instance-profile: true` aquí limitaría la resolución
      # únicamente a metadata de EC2 y rompería en ECS/EKS/local.

notifier:
  raw-events-queue: ${QUEUE_RAW_URL:raw-events}
  deliveries-queue: ${QUEUE_DELIVERIES_URL:deliveries}
  subscriptions-table: ${TABLE_SUBS:subscriptions}
  notification-events-table: ${TABLE_EVENTS:notification_events}
  http-connect-timeout: 5s
  http-read-timeout: 10s
  secret-prefix: cobre/webhook-hmac/
  secret-cache-ttl: 10m
  metrics-namespace: notification-events-delivery

management:
  cloudwatch:
    metrics:
      export:
        namespace: ${notifier.metrics-namespace}
